name: AI Slop Gate LLM Analysis (Groq)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  llm-analysis:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run AI Slop Gate (Groq PR analysis)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOPE_GATE_GROQ: ${{ secrets.SLOPE_GATE_GROQ }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e SLOPE_GATE_GROQ \
            ghcr.io/sergudo/ai-slop-gate:latest \
            run \
              --provider groq \
              --policy policy.yml \
              --github-repo "${{ github.repository }}" \
              --pr-id "${{ github.event.pull_request.number }}"
