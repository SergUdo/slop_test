name: AI Slop Gate Static Analysis

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  checks: write

jobs:
  static-analysis:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ai-slop-gate cache directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai-slop-gate
          key: ai-slop-gate-cache-${{ runner.os }}-${{ hashFiles('**/*.py', '**/*.yml', '**/*.yaml') }}
          restore-keys: |
            ai-slop-gate-cache-${{ runner.os }}-

      - name: Static Analysis (ai-slop-gate)
        id: static_gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p ~/.cache/ai-slop-gate
          
          # ✅ Визначаємо параметри залежно від типу події
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            EXTRA_ARGS="--github-repo ${{ github.repository }} --pr-id ${{ github.event.pull_request.number }}"
            echo "🔍 Running in PR mode: PR #${{ github.event.pull_request.number }}"
          else
            EXTRA_ARGS="--github-repo ${{ github.repository }} --github-sha ${{ github.sha }}"
            echo "🔍 Running in push mode: commit ${{ github.sha }}"
          fi
          
          echo "📦 Running AI Slop Gate with compliance enabled..."
          
          # ✅ Запускаємо з правильними параметрами
          # Примітка: compliance автоматично запускається якщо в policy.yml є compliance.enabled=true
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            -v ~/.cache/ai-slop-gate:/root/.cache/ai-slop-gate \
            -e GITHUB_TOKEN \
            ghcr.io/sergudo/ai-slop-gate:latest \
            run --provider static --path /data $EXTRA_ARGS

      - name: Label PR on Policy Violation
        if: steps.static_gate.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL_NAME="slop-detected"
          
          echo "🏷️  Adding label to PR..."
          
          gh label create "$LABEL_NAME" \
            --color "ff0000" \
            --description "AI Slop detected by static analysis" \
            --repo ${{ github.repository }} || true
          
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "$LABEL_NAME" \
            --repo ${{ github.repository }}

      - name: Final Status Check
        if: steps.static_gate.outcome == 'failure'
        run: |
          echo "❌ Static Analysis detected issues that violate the slop policy."
          exit 1