name: AI Slop Gate Static Analysis

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Allows manual triggering of the workflow
  workflow_dispatch:

# Grant permissions for managing PR labels, comments, and checking out content
permissions:
  pull-requests: write
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ai-slop-gate cache directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai-slop-gate
          key: ai-slop-gate-cache-${{ runner.os }}-${{ hashFiles('**/*.py', '**/*.yml', '**/*.yaml') }}
          restore-keys: |
            ai-slop-gate-cache-${{ runner.os }}-

      # Run static analysis. 'continue-on-error' allows us to label the PR even if slop is found.
      - name: Static Analysis (ai-slop-gate)
        id: static_gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p ~/.cache/ai-slop-gate
          # Записуємо звіт у файл report.txt, щоб потім його використати
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            -v ~/.cache/ai-slop-gate:/root/.cache/ai-slop-gate \
            -e GITHUB_TOKEN \
            ghcr.io/sergudo/ai-slop-gate:latest \
            run --provider static --path /data > report.txt 2>&1
          
          # Виводимо в консоль, щоб бачити логи в Actions
          cat report.txt

      - name: Post Static Report to PR
        if: steps.static_gate.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Формуємо заголовок коментаря
          echo "### 🚨 AI Slop Gate Static Report" > comment_body.md
          echo '```' >> comment_body.md
          # Витягуємо лише сам звіт з файлу (все, що між звітами)
          sed -n '/=== AI SLOP GATE REPORT ===/,/=== END OF REPORT ===/p' report.txt >> comment_body.md
          echo '```' >> comment_body.md
          
          # Відправляємо коментар у PR
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment_body.md --repo ${{ github.repository }}

      - name: Label PR on Policy Violation
        if: steps.static_gate.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "slop-detected" --color "ff0000" --force --repo ${{ github.repository }} || true
          gh pr edit ${{ github.event.pull_request.number }} --add-label "slop-detected" --repo ${{ github.repository }}

      - name: Final Status Check
        if: steps.static_gate.outcome == 'failure'
        run: |
          echo "Static Analysis detected policy violations. Check the PR comments."
          exit 1