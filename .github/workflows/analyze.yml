name: AI Slop Gate

on: [pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run AI Slop Gate
        uses: docker://ghcr.io/sergudo/ai-slop-gate:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS: "true"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        with:
          args: run --provider static --policy /app/policy.yml --path /github/workspace