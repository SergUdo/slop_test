name: AI Slop Gate

on: [pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run AI Slop Gate
        uses: docker://ghcr.io/sergudo/ai-slop-gate:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: /github/workflow/event.json
        with:
          args: run --provider static --path /github/workspace --policy /app/policy.yml