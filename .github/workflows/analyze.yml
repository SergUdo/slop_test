name: AI Slop Gate
on: [pull_request]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run AI Slop Gate
      uses: SergUdo/ai-slop-gate@main
      with:
        provider: 'groq'
        slope-gate-groq: ${{ secrets.SLOPE_GATE_GROQ }}
        compliance: 'true'
        enforcement: 'advisory'
