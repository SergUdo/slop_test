name: AI Slop Gate LLM Analysis

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Note: The permissions section is crucial for allowing the workflow to interact with pull requests and repository contents. Adjust the permissions as needed based on your specific requirements and security considerations.
permissions:
  pull-requests: write
  contents: read

jobs:
  llm-analysis:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run AI Slop Gate (Gemini PR analysis)
        id: slop_gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GEMINI_API_KEY \
            ghcr.io/sergudo/ai-slop-gate:latest \
            run \
              --provider gemini \
              --policy policy.yml \
              --github-repo "${{ github.repository }}" \
              --pr-id "${{ github.event.pull_request.number }}"
      # If you need to automatically close PRs that violate the policy, you can uncomment the following step. Make sure to have the necessary permissions and consider the implications of auto-closing PRs in your workflow.
      # - name: Close PR on Policy Violation
      #   if: steps.slop_gate.outcome == 'failure'
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh pr close ${{ github.event.pull_request.number }} \
      #       --comment "🚫 PR closed based on the AI Slop Gate analysis above. Please address the issues mentioned in the comments before re-submitting." \
      #       --repo ${{ github.repository }}
        # Замість закриття ПР, ми вішаємо на нього "червону мітку"
      - name: Label PR on Policy Violation
        if: steps.slop_gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub CLI сам зрозуміє, що це текст
          LABEL_NAME="slop-detected"
          
          gh label create "$LABEL_NAME" --color "ff0000" --description "AI Slop detected" --repo ${{ github.repository }} || true
          
          # Додаємо лейбл до ПР
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "$LABEL_NAME" \
            --repo ${{ github.repository }}

      - name: Fail workflow if slop detected
        if: steps.slop_gate.outcome == 'failure'
        run: exit 1