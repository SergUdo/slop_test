name: AI Slop Gate Static Analysis

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Allows manual triggering of the workflow
  workflow_dispatch:

# Grant permissions for managing PR labels, comments, and checking out content
permissions:
  pull-requests: write
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ai-slop-gate cache directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai-slop-gate
          key: ai-slop-gate-cache-${{ runner.os }}-${{ hashFiles('**/*.py', '**/*.yml', '**/*.yaml') }}
          restore-keys: |
            ai-slop-gate-cache-${{ runner.os }}-

      # Run static analysis. 'continue-on-error' allows us to label the PR even if slop is found.
      - name: Static Analysis (ai-slop-gate)
        id: static_gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p ~/.cache/ai-slop-gate
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            -v ~/.cache/ai-slop-gate:/root/.cache/ai-slop-gate \
            -e GITHUB_TOKEN \
            ghcr.io/sergudo/ai-slop-gate:latest \
            run \
              --provider static \
              --path /data \
              --github-repo "${{ github.repository }}"

      # Apply a 'slop-detected' label if the static analysis fails
      - name: Label PR on Policy Violation
        if: steps.static_gate.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL_NAME="slop-detected"
          
          # Create the label in the repository if it doesn't exist
          gh label create "$LABEL_NAME" \
            --color "ff0000" \
            --description "AI Slop detected by static analysis" \
            --repo ${{ github.repository }} || true
          
          # Assign the label to the current Pull Request
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "$LABEL_NAME" \
            --repo ${{ github.repository }}

      # Optional: Uncomment to automatically close PRs failing static analysis
      # - name: Close PR on Policy Violation
      #   if: steps.static_gate.outcome == 'failure' && github.event_name == 'pull_request'
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh pr close ${{ github.event.pull_request.number }} \
      #       --comment "🚫 PR closed based on Static Analysis. AI-generated patterns or low-quality slop detected." \
      #       --repo ${{ github.repository }}

      # Final check: Fail the workflow to block the merge if the gate failed
      - name: Final Status Check
        if: steps.static_gate.outcome == 'failure'
        run: |
          echo "Static Analysis detected issues that violate the slop policy."
          exit 1