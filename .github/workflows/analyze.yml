name: AI Slop Gate

on: [pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run AI Slop Gate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            ghcr.io/sergudo/ai-slop-gate:latest \
            run --provider static --policy /app/policy.yml --path /github/workspace