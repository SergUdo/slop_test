name: AI Slop Gate Analysis
on:
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run AI Slop Gate
        uses: docker://ghcr.io/sergudo/ai-slop-gate:latest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          args: run --provider gemini --path /github/workspace --policy /app/policy.yml --no-cache
          