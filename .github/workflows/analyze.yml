name: AI Slop Gate LLM GROQ Analysis

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  llm-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ai-slop-gate
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai-slop-gate
          key: ai-slop-gate-cache-${{ runner.os }}-${{ hashFiles('**/*.py', '**/*.yml') }}
          restore-keys: |
            ai-slop-gate-cache-${{ runner.os }}-

      - name: LLM Analysis (ai-slop-gate)
        id: llm_gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.SLOPE_GATE_GROQ }}
        run: |
          mkdir -p ~/.cache/ai-slop-gate
          
          if [ -z "$GROQ_API_KEY" ]; then
            echo "⚠️ GROQ_API_KEY not set, skipping"
            echo "verdict=SKIPPED" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🚀 Starting AI Slop Gate analysis via Groq..."
          
          set +e
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/src" \
            -v ~/.cache/ai-slop-gate:/root/.cache/ai-slop-gate \
            -e GITHUB_TOKEN \
            -e GROQ_API_KEY \
            ghcr.io/sergudo/ai-slop-gate:latest \
            run --provider groq --llm-local --policy /src/policy.yml --path /src > raw_report.txt 2>&1
          
          EXIT_CODE=$?
          set -e

          cat raw_report.txt

          VERDICT=$(grep "Policy Verdict:" raw_report.txt | awk '{print $NF}' | tr -d '\r' || echo "UNKNOWN")
          FINDINGS=$(grep "Total findings:" raw_report.txt | awk '{print $NF}' | tr -d '\r' || echo "0")
          
          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT
          echo "findings=$FINDINGS" >> $GITHUB_OUTPUT

      - name: Post Report to PR
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.llm_gate.outputs.verdict }}" = "SKIPPED" ] || [ -z "${{ steps.llm_gate.outputs.verdict }}" ]; then
            exit 0
          fi

          sed -n '/=== AI SLOP GATE REPORT ===/,/=== END OF REPORT ===/p' raw_report.txt > clean_report.md
          
          if [ ! -s clean_report.md ]; then
            echo "Analysis failed. Check logs." > clean_report.md
          fi

          VERDICT="${{ steps.llm_gate.outputs.verdict }}"
          FINDINGS="${{ steps.llm_gate.outputs.findings }}"
          
          case "$VERDICT" in
            "BLOCKING") EMOJI="🚨"; STATUS="**BLOCKING**";;
            "ADVISORY") EMOJI="⚠️"; STATUS="**ADVISORY**";;
            "ALLOW")    EMOJI="✅"; STATUS="**PASSED**";;
            *)          EMOJI="❓"; STATUS="**UNKNOWN**";;
          esac

          cat > final_comment.md << EOF
          ## $EMOJI AI Slop Gate LLM Analysis (Groq)
          **Status:** $STATUS
          **Findings:** $FINDINGS

          ---
          $(cat clean_report.md)

          ---
          <sub>🤖 Powered by Groq | Run: \`${{ github.run_id }}\`</sub>
          EOF

          gh pr comment ${{ github.event.pull_request.number }} --body-file final_comment.md --repo ${{ github.repository }}

      - name: Check Result
        if: steps.llm_gate.outputs.verdict == 'BLOCKING'
        run: exit 1